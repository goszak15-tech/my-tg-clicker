<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка</title> <!-- ИСПРАВИЛИ НАЗВАНИЕ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #ui {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin-bottom: 10px;
        }

        #game-container {
            position: relative;
            border: 4px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        canvas {
            display: block;
            background-color: #000;
        }

        .stat-box {
            font-size: 20px;
            font-weight: bold;
        }

        /* СТИЛИ ДЛЯ ОКНА ПРОИГРЫША */
        #game-over {
            display: none; /* Изначально скрыто */
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 300px;
            background: rgba(0, 0, 0, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        #game-over h2 {
            color: #ff4444;
            font-size: 30px;
            margin-bottom: 10px;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 60px;
            height: 60px;
            background: #333;
            color: white;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active { background: #4CAF50; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-box" id="score">Счет: 0</div>
        <div class="stat-box" id="level">Уровень: 1</div>
    </div>
    
    <div id="game-container">
        <canvas id="snakeGame" width="300" height="300"></canvas>
        
        <!-- ЭКРАН ПРОИГРЫША -->
        <div id="game-over">
            <h2>ИГРА ОКОНЧЕНА</h2>
            <p id="final-score">Ваш счет: 0</p>
            <button id="restart-btn" onclick="location.reload()">Играть снова</button>
        </div>
    </div>

    <div class="controls">
        <div class="btn up" onclick="changeDir('up')">↑</div>
        <div class="btn left" onclick="changeDir('left')">←</div>
        <div class="btn down" onclick="changeDir('down')">↓</div>
        <div class="btn right" onclick="changeDir('right')">→</</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const levelElement = document.getElementById("level");
        const gameOverScreen = document.getElementById("game-over");
        const finalScoreElement = document.getElementById("final-score");

        const box = 20; 
        let score = 0;
        let level = 1;
        let currentSpeed = 200; 

        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 15) * box,
            y: Math.floor(Math.random() * 15) * box
        };

        let dir = "right";

        function changeDir(newDir) {
            if (newDir === "up" && dir !== "down") dir = "up";
            if (newDir === "down" && dir !== "up") dir = "down";
            if (newDir === "left" && dir !== "right") dir = "left";
            if (newDir === "right" && dir !== "left") dir = "right";
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" && dir !== "down") dir = "up";
            if (e.key === "ArrowDown" && dir !== "up") dir = "down";
            if (e.key === "ArrowLeft" && dir !== "right") dir = "left";
            if (e.key === "ArrowRight" && dir !== "left") dir = "right";
        });

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#4CAF50" : "#81C784";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if (dir === "up") snakeY -= box;
            if (dir === "down") snakeY += box;
            if (dir === "left") snakeX -= box;
            if (dir === "right") snakeX += box;

            if (snakeX === food.x && snakeY === food.y) {
                score++;
                scoreElement.innerText = "Счет: " + score;
                if (score % 5 === 0) {
                    level++;
                    levelElement.innerText = "Уровень: " + level;
                    currentSpeed -= 20;
                    if (currentSpeed < 60) currentSpeed = 60;
                }
                food = {
                    x: Math.floor(Math.random() * 15) * box,
                    y: Math.floor(Math.random() * 15) * box
                };
            } else {
                snake.pop();
            }

            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                // ВМЕСТО alert() ПОКАЗЫВАЕМ НАШ ЭКРАН
                finalScoreElement.innerText = "Ваш счет: " + score + " | Уровень: " + level;
                gameOverScreen.style.display = "flex";
                return; // Останавливаем игру
            }

            snake.unshift(newHead);
            setTimeout(draw, currentSpeed);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x === array[i].x && head.y === array[i].y) return true;
            }
            return false;
        }

        draw();
    </script>
</body>
</html>
