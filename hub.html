<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Приложения</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #000);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .menu-button {
            width: 80%;
            max-width: 300px;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        /* Цвет для Змейки */
        .btn-snake {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
        }

        /* Цвет для Дней Рождения */
        .btn-birthdays {
            background: linear-gradient(135deg, #2196F3, #1565C0);
        }
    </style>
</head>
<body>

    <h1>Мои проекты 🚀</h1>

    <!-- ЗАМЕНИ ССЫЛКИ НИЖЕ НА СВОИ РЕАЛЬНЫЕ ССЫЛКИ -->
    <a href="https://my-tg-clicker.vercel.app/" class="menu-button btn-snake">🐍 Играть в Змейку</a>
    <a href="https://my-birthdays.vercel.app/" class="menu-button btn-birthdays">🎂 Дни Рождения</a>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
